<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício do Alien</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style> body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; } </style>
</head>

<body>
    <script>
        //define o tamanho da página do jogo
        const larguraJogo = 850;
        const alturaJogo = 585;

        //definir funções e configuração do jogo de acordo com o phaser
        const config = {
            type: Phaser.AUTO,
            width: larguraJogo,
            height: alturaJogo,

            //ativar a física do jogo
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: {y: 300},
                    debug: true
                }
            },

            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        //define as configurações do jogo de acordo com o framework phaser
        const game = new Phaser.Game(config);

        //criar variável da personagem
        var twilight;

        //criar variável das teclas
        var teclado;

        //criar variável do turbo
        var brilho;

        //criar variável do obstáculo
        var obstaculo;
        
        //criar variável do balão
        var balao;
        
        //criar variável do bolo
        var bolo;

        //criar variável do livro
        var livro;

        //criar variável da pontuação
        var pontuacao = 0;

        //criar variável do placar
        var placar;

        function preload() {

            //carregar o fundo
            this.load.image('background', 'assets/bg-equestria.png');
        
            //carregar o brilho
            this.load.image('brilho', 'assets/brilho.png');

            //carregar imagem da personagem
            this.load.image('twilight', 'assets/twilight.png');

            //carregar o obstaculo
            this.load.image('obstaculo', 'assets/obstaculo1.png');

            //carregar o balao
            this.load.image('balao', 'assets/obstaculoBalao.png');

            //carregar o bolo
            this.load.image('bolo', 'assets/obstaculoBolo.png');

            //carregar imagem do livro
            this.load.image('livro', 'assets/book.png');
        };

        function create() {

            //adicionar o fundo na tela
            this.add.image(larguraJogo/2, alturaJogo/2, 'background');
        
            //criar a personagem
            twilight = this.physics.add.sprite(larguraJogo/2, 0, 'twilight').setScale(0.15);
            
            //criar limites das bordas da tela do jogo
            twilight.setCollideWorldBounds(true);

            //acessar as teclas
            teclado = this.input.keyboard.createCursorKeys();

            //adicionar o brilho do modo turbo
            brilho = this.add.sprite(0, 0, 'brilho');
            brilho.setVisible(false);

            //adicionar o obstáculo
            obstaculo = this.physics.add.staticImage(larguraJogo/1.97, alturaJogo/1.39, 'obstaculo'); 
            //adicionar colisão
            this.physics.add.collider(twilight, obstaculo);
            
            //adicionar o balao
            balao = this.physics.add.staticImage(larguraJogo/1.264, alturaJogo/2.4, 'balao');
            //adicionar colisão
            this.physics.add.collider(twilight, balao);

            //adicionar o bolo
            bolo = this.physics.add.staticImage(larguraJogo/11.8, alturaJogo/1.28, 'bolo');
            //adicionar colisão
            this.physics.add.collider(twilight, bolo);
    
            // adicionando placar 
            placar = this.add.text(50, 50, 'Livros: ' + pontuacao, {fontSize:'45px', fill:'#ff08a0'});
            
            //adicionar o livro
            livro = this.physics.add.sprite(larguraJogo/2, 0, 'livro').setScale(0.1);
            //criar limites na tela para o livro
            livro.setCollideWorldBounds(true);
            //fazer o livro quicar
            livro.setBounce(0.7);

            //criar colisão com o obstáculo
            this.physics.add.collider(livro, obstaculo);

            //criar colisão com o balão
            this.physics.add.collider(livro, balao);
            
            //criar colisão com o bolo
            this.physics.add.collider(livro, bolo);
            
            //quando a twilight encostar no livro
            this.physics.add.overlap(twilight, livro, function(){
                //livro some
                livro.setVisible(false);
                //sorteia número aleatório para a posição
                var posicaoLivro_Y = Phaser.Math.RND.between(50, 650);
                //ajusta a posição do livro
                livro.setPosition(posicaoLivro_Y, 100);
                //adiciona um ponto
                pontuacao += 1;
                //atualiza o placar
                placar.setText('Livros: ' + pontuacao);
                //livro aparece
                livro.setVisible(true);
            });
        }

        function update() {
    
            //movimento para a esquerda
            if (teclado.left.isDown) {
                twilight.setVelocityX(-150);
            }

            //movimento para a direita
            else if (teclado.right.isDown) {
                twilight.setVelocityX(150);
            }

            //sem movimento horizontal
            else {
                twilight.setVelocityX(0);
            }

            //movimento para cima e ativação do brilho
            if (teclado.up.isDown) {
                twilight.setVelocityY(-150);
                ativarTurbo();
            }

            //movimento para baixo e desativar o brilho
            else {
                semTurbo();
            }

            //atualizar a posição do brilho em relação à personagem
            brilho.setPosition(twilight.x, twilight.y + twilight.height/14).setScale(0.3);
        };
        
        //ativar o brilho quando ligar o turbo
        function ativarTurbo() {
            brilho.setVisible(true);
        };
        
        //desativar o brilho quando desligar o turbo
        function semTurbo() {
            brilho.setVisible(false);
        };

    </script>
</body>
</html>
